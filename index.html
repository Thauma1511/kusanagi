<meta name="description" content="Kusanagi : apprendre l'écriture japonaise (hiragana, katakana, kanji) avec des cartes et des QCM.">

<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" href="splash-2556x1179.png">

<title>Kusanagi</title>
<style>
@font-face {
  font-family: "Kusanagi JP";
  src: url(fonts/klee-one-semibold-kusanagi.woff2) format("woff2");
  font-weight: 400 700;
  font-display: swap;
  unicode-range: U+3000-30FF, U+4E00-9FFF;
}
:root {
  color-scheme: dark;
  --bg: #111012;
  --surface: #1a191c;
  --surface-2: #232126;
  --surface-3: #2e2c32;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .16);
  --text: #f4efe6;
  --muted: #a9a39a;
  --shu: #e5533d;
  --ok: #43c38e;
  --ko: #f2a541;
  --ok-fond: rgba(67, 195, 142, .14);
  --ko-fond: rgba(242, 165, 65, .14);
  --rayon: 22px;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --jp: "Kusanagi JP", -apple-system, BlinkMacSystemFont, system-ui, "Hiragino Sans", "Yu Gothic", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, .carte:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
button:disabled { cursor: default; }
.jp { font-family: var(--jp); font-weight: 600; }
svg { display: block; }

#app { min-height: 100%; overflow-x: clip; }
.ecran {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
  display: flex;
  flex-direction: column;
}
.entree { animation: entree .32s cubic-bezier(.2, .8, .2, 1) both; }
.entree-retour { animation: entree-retour .32s cubic-bezier(.2, .8, .2, 1) both; }
.fondu { animation: fondu .25s ease both; }
@keyframes entree { from { opacity: 0; transform: translateX(28px); } }
@keyframes entree-retour { from { opacity: 0; transform: translateX(-28px); } }
@keyframes fondu { from { opacity: 0; } }

/* ---------- Boutons ---------- */
.icone-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--text);
  transition: background-color .15s, transform .1s;
  flex: none;
}
.icone-btn svg { width: 22px; height: 22px; }
.icone-btn:active { transform: scale(.92); background: var(--surface-3); }
.btn-primaire, .btn-secondaire {
  width: 100%;
  min-height: 56px;
  border-radius: 16px;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.01em;
  transition: background-color .15s, transform .1s, opacity .15s;
}
.btn-primaire { background: var(--text); color: #141315; }
.btn-secondaire { background: var(--surface-2); color: var(--text); }
.btn-primaire:active:not(:disabled), .btn-secondaire:active { transform: scale(.98); }
.btn-primaire:disabled { opacity: .35; }
.btn-petit {
  min-height: 36px; padding: 0 14px;
  border-radius: 10px;
  background: var(--surface-3);
  color: var(--text);
  font-size: 14px; font-weight: 600;
  transition: background-color .15s, transform .1s;
}
.btn-petit:active { transform: scale(.96); }
.btn-petit.attention { background: var(--ko); color: #1c1407; }
@media (hover: hover) {
  .icone-btn:hover { background: var(--surface-2); }
  .btn-primaire:hover:not(:disabled) { background: #ffffff; }
  .btn-secondaire:hover { background: var(--surface-3); }
  .btn-petit:hover { background: #3a3840; }
  .btn-petit.attention:hover { background: #f7b65d; }
}

/* ---------- Accueil ---------- */
.entete { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 26px; }
.marque { display: flex; align-items: center; gap: 14px; }
.marque svg { width: 46px; height: 46px; }
.marque h1 { margin: 0; font-size: 28px; line-height: 1.05; letter-spacing: -.025em; font-weight: 700; }
.marque p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.decks { display: flex; flex-direction: column; gap: 12px; }
.tuile {
  display: flex; align-items: center; gap: 16px;
  width: 100%;
  padding: 16px 14px 16px 16px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--rayon);
  transition: background-color .15s, border-color .15s, transform .1s;
}
.tuile:active { transform: scale(.985); background: var(--surface-2); }
@media (hover: hover) { .tuile:hover { background: var(--surface-2); border-color: var(--line-2); } }
.tuile-glyphe {
  flex: none;
  width: 68px; height: 68px;
  display: grid; place-items: center;
  border-radius: 18px;
  background: var(--surface-3);
  font-size: 46px; line-height: 1;
}
.tuile-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tuile-titre { font-size: 19px; font-weight: 650; letter-spacing: -.015em; }
.tuile-titre .jp { font-size: 14px; color: var(--muted); margin-left: 6px; font-weight: 600; }
.tuile-desc { color: var(--muted); font-size: 14px; }
.barre { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 8px; }
.barre > span { display: block; height: 100%; background: var(--ok); border-radius: 4px; min-width: 0; transition: width .4s; }
.tuile-stats { font-size: 13px; color: var(--muted); margin-top: 2px; }
.a-revoir { color: var(--ko); font-weight: 600; }
.chevron { color: var(--muted); flex: none; }
.chevron svg { width: 18px; height: 18px; }
.note-accueil { margin: 26px 4px 0; color: var(--muted); font-size: 13px; text-align: center; }

/* ---------- Barre du haut (deck, réglages) ---------- */
.barre-haut { display: flex; align-items: center; gap: 6px; margin: 0 0 18px -10px; min-height: 48px; }
.barre-haut h2 { margin: 0; font-size: 22px; letter-spacing: -.02em; font-weight: 700; }
.barre-haut h2 .jp { font-size: 15px; color: var(--muted); margin-left: 6px; }
.bloc { margin-bottom: 26px; }
.bloc-titre { margin: 0 0 10px 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.liste { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.ligne-niveau {
  display: flex; align-items: center; gap: 14px;
  width: 100%;
  padding: 14px 16px;
  text-align: left;
  transition: background-color .15s;
}
.ligne-niveau + .ligne-niveau { border-top: 1px solid var(--line); }
.ligne-niveau:active { background: var(--surface-3); }
@media (hover: hover) { .ligne-niveau:hover { background: var(--surface-2); } }
.coche {
  flex: none;
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--line-2);
  display: grid; place-items: center;
  color: transparent;
  transition: background-color .15s, border-color .15s, color .15s;
}
.coche svg { width: 15px; height: 15px; }
.ligne-niveau[aria-pressed="true"] .coche { background: var(--shu); border-color: var(--shu); color: #fff; }
.ligne-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ligne-titre { font-weight: 600; font-size: 16px; }
.ligne-detail { font-family: var(--jp); font-weight: 600; color: var(--muted); font-size: 14px; }
.ligne-compte { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; flex: none; }

.segment {
  display: flex;
  padding: 4px;
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.segment button {
  flex: 1;
  min-height: 40px;
  padding: 0 10px;
  border-radius: 10px;
  color: var(--muted);
  font-weight: 600;
  font-size: 15px;
  white-space: nowrap;
  transition: background-color .15s, color .15s;
}
.segment button .jp { font-weight: 600; }
.segment button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
@media (hover: hover) { .segment button:hover { color: var(--text); background: var(--surface-2); } .segment button[aria-pressed="true"]:hover { background: var(--surface-3); } }
.aide-mode { color: var(--muted); font-size: 14px; margin: 10px 4px 0; }
.options-qcm { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.option-ligne { display: flex; align-items: center; gap: 14px; }
.option-ligne > span { width: 48px; flex: none; color: var(--muted); font-size: 14px; font-weight: 600; }
.option-ligne .segment { flex: 1; }
.pied { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.deck { padding-bottom: 0; }
.deck .pied {
  position: sticky; bottom: 0; z-index: 2;
  margin-top: auto;
  padding: 22px 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: linear-gradient(to bottom, rgba(17, 16, 18, 0), var(--bg) 26px);
}
.resume { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 4px; }

/* ---------- Session ---------- */
.session { height: 100dvh; min-height: 0; overflow: hidden; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }
.barre-session { display: flex; align-items: center; gap: 12px; margin-left: -10px; min-height: 48px; flex: none; }
.progression { flex: 1; height: 6px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.progression > span { display: block; height: 100%; background: var(--text); border-radius: 6px; transition: width .35s cubic-bezier(.2, .8, .2, 1); }
.compteur { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.zone-cartes { flex: 1; min-height: 0; display: grid; place-items: center; padding: 14px 0; }
.pile { position: relative; width: min(100%, 360px); height: min(100%, 520px); }
.carte {
  position: absolute; inset: 0;
  touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  cursor: grab;
  will-change: transform;
  perspective: 1400px;
}
.carte.tenue { cursor: grabbing; }
.carte-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.3, .7, .2, 1);
}
.carte.retournee .carte-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 28px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .7);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 26px 22px;
  text-align: center;
  overflow: hidden;
}
.face.arriere { transform: rotateY(180deg); background: var(--surface-2); }
.glyphe { font-size: 190px; line-height: 1; }
.glyphe.long { font-size: 140px; letter-spacing: -.04em; }
.glyphe.kanji { font-size: 205px; }
.face-legende { position: absolute; bottom: 20px; left: 0; right: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.face-legende small { display: block; font-size: 12.5px; opacity: .8; }
.glyphe-petit { font-size: 56px; line-height: 1; color: var(--muted); margin-bottom: 14px; }
.romaji { font-size: 76px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.note { margin: 20px 0 0; color: var(--muted); font-size: 15px; max-width: 26ch; }
.sens { font-size: 34px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-bottom: 22px; }
.lectures { margin: 0; width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; }
.lectures div { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-radius: 14px; background: var(--surface-3); }
.lectures dt { color: var(--muted); font-size: 13px; }
.lectures dt small { font-size: 12px; opacity: .85; }
.lectures dd { margin: 0; font-size: 21px; font-weight: 650; }
.oku { color: var(--muted); font-weight: 500; }
.legende-oku { margin: 12px 0 0; color: var(--muted); font-size: 12px; }
.tampon {
  position: absolute; top: 26px;
  padding: 6px 12px;
  border: 3px solid currentColor;
  border-radius: 10px;
  font-weight: 800; font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
  opacity: 0;
  pointer-events: none;
  background: rgba(17, 16, 18, .55);
}
.tampon.sais { left: 22px; color: var(--ok); transform: rotate(-12deg); }
.tampon.revoir { right: 22px; color: var(--ko); transform: rotate(12deg); font-size: 17px; }
.carte-suivante { pointer-events: none; transform: translateY(12px) scale(.94); }
.carte-suivante .face { box-shadow: none; }
.carte-suivante .face::after { content: ""; position: absolute; inset: 0; background: rgba(17, 16, 18, .45); }
.carte-nouvelle { animation: nouvelle .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes nouvelle { from { transform: translateY(12px) scale(.94); } }

.indices { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex: none; font-size: 15px; font-weight: 600; padding: 4px 2px 0; white-space: nowrap; }
.indice { display: flex; align-items: center; gap: 6px; }
.indice svg { width: 18px; height: 18px; }
.indice.gauche { color: var(--ko); }
.indice.droite { color: var(--ok); }

/* ---------- QCM ---------- */
.question {
  flex: 1; min-height: 150px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  padding: 10px 0 18px;
  text-align: center;
}
.question-consigne { color: var(--muted); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.question-texte { line-height: 1.05; }
.question-texte.jp { font-size: 165px; }
.question-texte.jp.long { font-size: 128px; }
.question-texte.romaji-q { font-size: 72px; font-weight: 700; letter-spacing: -.03em; }
.question-texte.fr-q { font-size: 38px; font-weight: 700; letter-spacing: -.02em; max-width: 16ch; }
.choix { display: grid; gap: 10px; flex: none; }
.choix.c1 { grid-template-columns: 1fr; }
.choix.c2 { grid-template-columns: 1fr 1fr; }
.choix.c3 { grid-template-columns: 1fr 1fr 1fr; }
.option {
  min-height: 76px;
  padding: 12px 10px;
  border-radius: 18px;
  background: var(--surface);
  border: 1.5px solid var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transition: background-color .15s, border-color .15s, transform .1s, opacity .2s;
}
.option:active:not(:disabled) { transform: scale(.97); background: var(--surface-3); }
@media (hover: hover) { .option:hover:not(:disabled) { background: var(--surface-2); border-color: rgba(255, 255, 255, .3); } }
.option-texte { font-size: 24px; font-weight: 650; line-height: 1.15; }
.option-texte.jp { font-size: 58px; line-height: 1; font-weight: 600; }
.option-texte.fr-o { font-size: 18px; }
.option-sous { display: none; font-size: 14px; color: var(--muted); font-weight: 600; }
.option-sous.jp { font-size: 20px; }
.repondu .option-sous { display: block; }
.repondu .option { cursor: default; }
.repondu .option:not(.juste):not(.faux) { opacity: .55; }
.option.juste { background: var(--ok-fond); border-color: var(--ok); }
.option.faux { background: var(--ko-fond); border-color: var(--ko); }
.option-duel { min-height: 190px; border-radius: 24px; }
.option-duel .option-texte.jp { font-size: 112px; }
.duel .repondu .option.autre { opacity: 1; }
.duel .repondu .option-sous { font-size: 20px; color: var(--text); }
.duel .question-consigne { text-transform: none; letter-spacing: 0; font-size: 16px; }
.apres { flex: none; display: flex; flex-direction: column; gap: 12px; padding-top: 14px; animation: fondu .25s ease both; }
.explication { margin: 0; font-size: 15px; color: var(--muted); text-align: center; min-height: 22px; }
.explication b { color: var(--text); }
.explication .verdict-ok { color: var(--ok); }
.explication .verdict-ko { color: var(--ko); }
.explication .jp { color: var(--text); }
.explication .lect { display: block; margin-top: 4px; font-size: 14px; }

/* ---------- Résultats ---------- */
.resultat-tete { text-align: center; padding: 48px 0 30px; }
.resultat-chiffre { font-size: 84px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.resultat-chiffre span { font-size: 34px; color: var(--muted); font-weight: 700; }
.resultat-tete h2 { margin: 14px 0 6px; font-size: 24px; letter-spacing: -.02em; }
.resultat-tete p { margin: 0 auto; color: var(--muted); max-width: 32ch; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { display: inline-flex; align-items: baseline; gap: 8px; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.puce .jp { font-size: 22px; }
.puce span:last-child { color: var(--muted); font-size: 15px; }

/* ---------- Réglages ---------- */
.ligne-reset { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; }
.ligne-reset + .ligne-reset { border-top: 1px solid var(--line); }
.ligne-reset > span:first-child { flex: 1; min-width: 0; display: flex; flex-direction: column; font-weight: 600; }
.ligne-reset small { color: var(--muted); font-weight: 500; font-size: 13px; }
.ligne-reset .actions { display: flex; gap: 8px; }
.a-propos p { margin: 0 4px; color: var(--muted); font-size: 14px; }
.a-propos p + p { margin-top: 10px; }

@media (max-height: 700px) {
  .glyphe { font-size: 150px; } .glyphe.kanji { font-size: 165px; } .glyphe.long { font-size: 112px; }
  .question-texte.jp { font-size: 125px; } .question-texte.jp.long { font-size: 100px; } .question-texte.romaji-q { font-size: 58px; }
  .option { min-height: 64px; } .option-duel { min-height: 150px; } .option-duel .option-texte.jp { font-size: 88px; } .option-texte.jp { font-size: 46px; }
  .romaji { font-size: 62px; } .sens { font-size: 28px; margin-bottom: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .entree, .entree-retour, .carte-nouvelle { animation: fondu .2s ease both; }
  .carte-inner { transition: transform .01s; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="14 14 72 72"><circle cx="50" cy="50" r="27" fill="none" stroke="#F4EFE6" stroke-width="3"/><path d="M27 73 Q55 47 80 18 Q61 47 30.5 76 Z" fill="#E5533D" stroke="#111012" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"/><path d="M23.5 70.5 L32.5 79.5" stroke="#F4EFE6" stroke-width="2.6" stroke-linecap="round"/><path d="M28 75 L19 84" stroke="#F4EFE6" stroke-width="4.2" stroke-linecap="round"/></symbol></svg>
